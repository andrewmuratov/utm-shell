name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} / Unix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate portable shell syntax
        run: |
          sh -n setup.sh
          sh -n connect.sh
          sh -n install.sh
          sh -n uninstall.sh
          sh -n doctor.sh
          bash -n remote.sh
          if command -v dash >/dev/null 2>&1; then
            for f in setup.sh connect.sh install.sh uninstall.sh doctor.sh; do dash -n "$f"; done
          fi

      - name: Smoke-test CLIs and VPN automation
        run: |
          sh setup.sh --help >/dev/null
          sh connect.sh --help >/dev/null
          sh connect.sh files >/dev/null
          sh install.sh --help >/dev/null
          sh uninstall.sh --help >/dev/null
          sh doctor.sh --help >/dev/null
          grep -q 'general.vpn.utoronto.ca' connect.sh
          grep -Fq "cisco-secure-client-vpn_[0-9]*_amd64.deb" connect.sh
          grep -q 'install_linux_download_if_ready' connect.sh
          grep -q 'Cisco download found' connect.sh
          grep -q "VERSION='1.7.0'" setup.sh

      - name: Test remote shell in a clean temporary HOME
        run: |
          temp_home="$(mktemp -d)"
          HOME="$temp_home" bash remote.sh 1 >/dev/null
          bash -n "$temp_home/.bashrc"
          bash -n "$temp_home/.config/utm-shell/shell.sh"
          HOME="$temp_home" bash --noprofile --norc -ic 'source ~/.config/utm-shell/shell.sh; type c usage py gs utm-help >/dev/null; utm-version' 2>/dev/null | grep -q '1.7.0'

  alpine:
    name: Alpine / BusyBox sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test non-DEB/RPM Linux shell path
        run: |
          docker run --rm -v "$PWD:/repo:ro" alpine:3.22 sh -c '
            cd /repo
            for f in setup.sh connect.sh install.sh uninstall.sh doctor.sh; do sh -n "$f"; done
            sh setup.sh --help >/dev/null
            sh connect.sh --help >/dev/null
            sh connect.sh files >/dev/null
            sh install.sh --help >/dev/null
            sh uninstall.sh --help >/dev/null
            sh doctor.sh --help >/dev/null
          '

  freebsd:
    name: FreeBSD / base sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            command -v sh
            command -v ssh
            command -v fetch
          run: |
            for f in setup.sh connect.sh install.sh uninstall.sh doctor.sh; do sh -n "$f"; done
            sh setup.sh --help >/dev/null
            sh connect.sh --help >/dev/null
            sh connect.sh files >/dev/null
            sh install.sh --help >/dev/null
            sh uninstall.sh --help >/dev/null
            sh doctor.sh --help >/dev/null

  openbsd:
    name: OpenBSD / base sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            command -v sh
            command -v ssh
            command -v ftp
          run: |
            for f in setup.sh connect.sh install.sh uninstall.sh doctor.sh; do sh -n "$f"; done
            sh setup.sh --help >/dev/null
            sh connect.sh --help >/dev/null
            sh connect.sh files >/dev/null
            sh install.sh --help >/dev/null
            sh uninstall.sh --help >/dev/null
            sh doctor.sh --help >/dev/null

  windows:
    name: Windows / PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('setup.ps1', 'connect.ps1', 'install.ps1', 'uninstall.ps1', 'doctor.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "$file has parser errors:`n$($errors | Out-String)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke-test PowerShell CLIs and VPN automation
        shell: pwsh
        run: |
          .\setup.ps1 -Help | Out-Null
          .\connect.ps1 help | Out-Null
          .\connect.ps1 files | Out-Null
          .\install.ps1 -Help | Out-Null
          .\uninstall.ps1 -Help | Out-Null
          .\doctor.ps1 -Help | Out-Null
          $connect = Get-Content .\connect.ps1 -Raw
          if ($connect -notmatch 'general.vpn.utoronto.ca') { throw 'VPN server missing' }
          if ($connect -notmatch 'core-vpn') { throw 'Windows VPN module guidance missing' }
          if ($connect -notmatch 'Try-AutoInstallCisco') { throw 'Windows VPN auto-install missing' }
          if ((Get-Content .\setup.ps1 -Raw) -notmatch "Version = '1.7.0'") { throw 'Version mismatch' }
