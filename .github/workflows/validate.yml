name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} / Bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n setup.sh
          bash -n remote.sh
          bash -n connect.sh
          bash -n install.sh
          bash -n uninstall.sh
          bash -n doctor.sh

      - name: Smoke-test Bash CLIs
        run: |
          bash setup.sh --help >/dev/null
          bash connect.sh --help >/dev/null
          bash install.sh --help >/dev/null
          bash uninstall.sh --help >/dev/null
          bash doctor.sh --help >/dev/null

      - name: Test remote shell in a clean temporary HOME
        run: |
          temp_home="$(mktemp -d)"
          HOME="$temp_home" bash remote.sh 1 >/dev/null
          bash -n "$temp_home/.bashrc"
          bash -n "$temp_home/.config/utm-shell/shell.sh"
          HOME="$temp_home" bash --noprofile --norc -ic 'source ~/.config/utm-shell/shell.sh; type c usage py gs utm-help >/dev/null; utm-version' 2>/dev/null | grep -q '1.3.0'

  windows:
    name: windows-latest / PowerShell
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('setup.ps1', 'connect.ps1', 'install.ps1', 'uninstall.ps1', 'doctor.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "$file has parser errors:`n$($errors | Out-String)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke-test PowerShell CLIs
        shell: pwsh
        run: |
          .\setup.ps1 -Help | Out-Null
          .\connect.ps1 help | Out-Null
          .\install.ps1 -Help | Out-Null
          .\uninstall.ps1 -Help | Out-Null
          .\doctor.ps1 -Help | Out-Null
