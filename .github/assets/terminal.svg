<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">utm-shell connection flow</title>
  <desc id="desc">A polished dark terminal-style banner showing the utm command on a student's computer, a campus network or UTORvpn connection check, and the clean UTM lab shell prompt.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Transparent canvas so the banner sits naturally on GitHub light or dark themes. -->
  <rect width="1200" height="500" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="24" y="24" width="1152" height="452" rx="26" fill="url(#page)" stroke="#30363d" stroke-width="2"/>
  </g>

  <!-- Header -->
  <circle cx="62" cy="62" r="7" fill="#ff5f57"/>
  <circle cx="86" cy="62" r="7" fill="#febc2e"/>
  <circle cx="110" cy="62" r="7" fill="#28c840"/>
  <text x="600" y="68" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="0.4">utm-shell · UTM lab access</text>
  <path d="M24 96H1176" stroke="#30363d" stroke-width="2"/>

  <!-- Left terminal: local machine -->
  <rect x="58" y="132" width="430" height="250" rx="18" fill="url(#panel)" stroke="#30363d"/>
  <text x="84" y="164" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">YOUR COMPUTER</text>
  <circle cx="450" cy="157" r="4" fill="#3fb950"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="84" y="218" fill="#8b949e" font-size="20">~</text>
    <text x="84" y="260" fill="#58a6ff" font-size="26" font-weight="700">❯</text>
    <text x="118" y="260" fill="#f0f6fc" font-size="25">utm</text>

    <text x="84" y="322" fill="#8b949e" font-size="16">one command to connect</text>
    <text x="84" y="350" fill="#6e7681" font-size="15">Windows · macOS · Linux · WSL</text>
  </g>

  <!-- Connection bridge -->
  <circle cx="600" cy="250" r="78" fill="#58a6ff" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="600" cy="250" r="54" fill="#0d1117" stroke="#388bfd" stroke-width="2"/>

  <!-- Shield icon -->
  <path d="M600 218c17 9 31 11 31 11v21c0 22-13 37-31 47-18-10-31-25-31-47v-21s14-2 31-11z" fill="#1f6feb" opacity="0.25" stroke="#58a6ff" stroke-width="2"/>
  <path d="M585 250l10 10 21-23" fill="none" stroke="#7ee787" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M502 250H542" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M532 241l10 9-10 9" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M658 250H698" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M688 241l10 9-10 9" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="330" text-anchor="middle" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">campus network</text>
  <text x="600" y="352" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">or UTORvpn</text>

  <!-- Right terminal: UTM -->
  <rect x="712" y="132" width="430" height="250" rx="18" fill="url(#panel)" stroke="#30363d"/>
  <text x="738" y="164" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">UTM LAB</text>
  <circle cx="1104" cy="157" r="4" fill="#3fb950"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="738" y="220" fill="#58a6ff" font-size="22" font-weight="700">UTM</text>
    <text x="798" y="220" fill="#8b949e" font-size="19">student@dh2026pc08</text>
    <text x="1048" y="220" fill="#f0f6fc" font-size="19">~</text>

    <text x="738" y="264" fill="#58a6ff" font-size="26" font-weight="700">❯</text>
    <text x="772" y="264" fill="#f0f6fc" font-size="23">utm-help</text>

    <text x="738" y="316" fill="#8b949e" font-size="16">ll   c   py   mkcd   ff   gs   bye</text>
    <text x="738" y="350" fill="#6e7681" font-size="15">clean shell · passwordless SSH</text>
  </g>

  <!-- Footer -->
  <text x="600" y="432" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">
    at home? utm explains UTORvpn · on campus? it connects directly
  </text>
</svg>
